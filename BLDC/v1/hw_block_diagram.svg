<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1660" width="2000" height="1660" font-family="Malgun Gothic, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .b{fill:#fff;stroke:#000;stroke-width:4}
      .o{fill:#f1f4fa;stroke:#000;stroke-width:4}
      .l{fill:none;stroke:#000;stroke-width:4}
      .p{fill:none;stroke:#b3261e;stroke-width:9}
      .x{fill:none;stroke:#555;stroke-width:4}
      .t{font-size:24px;font-weight:bold;text-anchor:middle}
      .s{font-size:19px;fill:#555;text-anchor:middle}
      .n{font-size:20px;fill:#555}
      .v{font-size:22px}
      .r{fill:#b3261e}
    </style>
  </defs>
  <rect width="2000" height="1660" fill="#fff"/>

  <text x="32" y="62" font-size="38" font-weight="bold">HW 블록도 (BLDC v1 · 3S)</text>

  <!-- 범례 -->
  <g>
    <rect x="1000" y="38" width="44" height="26" class="o" style="stroke-width:3"/>
    <text x="1054" y="59" class="n">PCB 밖</text>
    <line x1="1160" y1="51" x2="1214" y2="51" class="p"/>
    <text x="1224" y="59" class="n">모터 전류</text>
    <line x1="1350" y1="51" x2="1404" y2="51" class="l"/>
    <text x="1414" y="59" class="n">로직 전원·신호</text>
    <line x1="1590" y1="51" x2="1644" y2="51" class="x" stroke-dasharray="14 10"/>
    <text x="1654" y="59" class="n">무선·개발·백업 연결</text>
  </g>

  <!-- PCB 경계 -->
  <rect x="540" y="270" width="920" height="1020" rx="14" fill="#f2f8f0" stroke="#2f6b34" stroke-width="4" stroke-dasharray="20 12"/>
  <text x="560" y="306" font-size="24" font-weight="bold" fill="#2f6b34">PCB (2층 0.8mm, 직접 납땜)</text>

  <!-- HC-SR04 -->
  <rect x="1000" y="110" width="240" height="100" rx="10" class="o"/>
  <text x="1120" y="154" class="t">HC-SR04</text>
  <text x="1120" y="184" class="s">초음파 고도 (보유)</text>
  <rect x="1000" y="325" width="160" height="50" rx="6" class="b"/>
  <text x="1080" y="358" class="t" style="font-size:22px">J2 4P</text>
  <path class="l" d="M1080,210V325" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="l" d="M1080,375V480" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1096" y="425" class="v">Trig PE5</text>
  <text x="1096" y="453" class="v">Echo PE4 (INT4)</text>

  <!-- GY-521 -->
  <rect x="600" y="325" width="220" height="100" rx="8" class="b"/>
  <text x="710" y="368" class="t">GY-521 소켓 8P</text>
  <text x="710" y="398" class="s">MPU-6050 (구매 예정)</text>
  <path class="l" d="M820,375H930V480" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="915" y="447" class="v" text-anchor="end">I²C PD0/PD1</text>
  <text x="915" y="473" class="v" text-anchor="end">INT PE6 (INT6)</text>

  <!-- MCU -->
  <rect x="880" y="480" width="320" height="320" rx="28" class="b" style="stroke-width:7"/>
  <rect x="908" y="508" width="264" height="264" rx="14" class="l"/>
  <text x="1040" y="598" font-size="44" text-anchor="middle">ATMEGA</text>
  <text x="1040" y="652" font-size="44" text-anchor="middle">128A</text>
  <text x="1040" y="696" class="s">AT128A-70B 모듈 (대여)</text>
  <text x="1040" y="724" class="s">16MHz · 5V</text>
  <text x="1040" y="752" class="s">암헤더 1×15 ×4 탈착</text>

  <!-- 조종 -->
  <rect x="40" y="510" width="200" height="130" rx="10" class="o"/>
  <text x="140" y="566" class="t">Laptop</text>
  <text x="140" y="598" class="s">Tera Term</text>
  <rect x="300" y="515" width="170" height="90" rx="10" class="o"/>
  <text x="385" y="553" class="t">HC-06</text>
  <text x="385" y="583" class="s">구매 예정</text>
  <path class="l" d="M240,560H300" stroke-dasharray="12 8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="270" y="546" class="s" style="font-size:17px">BT</text>
  <rect x="570" y="520" width="80" height="80" rx="6" class="b"/>
  <text x="610" y="568" class="t" style="font-size:22px">J4 4P</text>
  <path class="l" d="M470,560H570" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="695" y="520" width="150" height="80" rx="6" class="b"/>
  <text x="770" y="553" class="t" style="font-size:21px">TXD 분압</text>
  <text x="770" y="582" class="s">1k / 2k → 3.3V</text>
  <path class="l" d="M650,560H695"/>
  <path class="l" d="M845,560H880"/>
  <text x="710" y="634" class="s">USART1 (PD2 RXD1 / PD3 TXD1)</text>

  <!-- 유선 백업·JTAG -->
  <rect x="300" y="680" width="170" height="80" rx="10" class="o"/>
  <text x="385" y="716" class="t" style="font-size:21px;fill:#555">AR-UART2USB</text>
  <text x="385" y="744" class="s">CP2102 (대여)</text>
  <path class="x" d="M180,640V720H300" marker-end="url(#g)"/>
  <path class="x" d="M470,720H880" stroke-dasharray="14 10" marker-end="url(#g)"/>
  <text x="680" y="706" class="s" style="font-size:17px">모듈 USART 커넥터, HC-06과 동시 연결 금지</text>
  <path class="x" d="M100,640V780H880" stroke-dasharray="14 10" marker-end="url(#g)"/>
  <text x="675" y="768" class="s" style="font-size:17px">JTAG (개발용, PCB 회로 없음)</text>

  <!-- ESC 신호 -->
  <rect x="1235" y="600" width="130" height="90" rx="6" class="b"/>
  <text x="1300" y="634" class="s" style="fill:#000;font-size:17px">100Ω ×4 직렬</text>
  <text x="1300" y="664" class="s" style="fill:#000;font-size:17px">10k ×4 풀다운</text>
  <text x="1300" y="560" class="v" text-anchor="middle">PWM ×4</text>
  <text x="1300" y="588" class="s" style="font-size:17px">PB5·PB6·PB7·PE3</text>
  <path class="l" d="M1200,645H1235" marker-end="url(#a)"/>
  <rect x="1385" y="600" width="60" height="90" rx="6" class="b"/>
  <text x="1415" y="640" class="t" style="font-size:20px">J3</text>
  <text x="1415" y="666" class="s" style="font-size:17px">5P</text>
  <path class="l" d="M1365,645H1385"/>
  <path class="l" d="M1445,645H1495"/>
  <circle cx="1495" cy="645" r="6"/>
  <path class="l" d="M1495,280V790"/>
  <g class="l" marker-end="url(#a)">
    <path class="l" d="M1495,280H1540" marker-end="url(#a)"/>
    <path class="l" d="M1495,450H1540" marker-end="url(#a)"/>
    <path class="l" d="M1495,620H1540" marker-end="url(#a)"/>
    <path class="l" d="M1495,790H1540" marker-end="url(#a)"/>
  </g>

  <!-- ESC / 모터 -->
  <text x="1630" y="205" class="t">ESC ×4</text>
  <text x="1630" y="233" class="s">구매 완료, BEC 미사용</text>
  <text x="1880" y="205" class="t">BLDC ×4</text>
  <text x="1880" y="233" class="s">2204 (구매 완료)</text>
  <g>
    <rect x="1540" y="250" width="180" height="110" rx="10" class="o"/>
    <rect x="1540" y="420" width="180" height="110" rx="10" class="o"/>
    <rect x="1540" y="590" width="180" height="110" rx="10" class="o"/>
    <rect x="1540" y="760" width="180" height="110" rx="10" class="o"/>
    <text x="1630" y="300" class="t">ESC1</text><text x="1630" y="328" class="s">PB5 (OC1A)</text>
    <text x="1630" y="470" class="t">ESC2</text><text x="1630" y="498" class="s">PB6 (OC1B)</text>
    <text x="1630" y="640" class="t">ESC3</text><text x="1630" y="668" class="s">PB7 (OC1C)</text>
    <text x="1630" y="810" class="t">ESC4</text><text x="1630" y="838" class="s">PE3 (OC3A)</text>
  </g>
  <g>
    <circle cx="1880" cy="305" r="48" class="o"/><text x="1880" y="316" class="t" style="font-size:30px">M1</text>
    <circle cx="1880" cy="475" r="48" class="o"/><text x="1880" y="486" class="t" style="font-size:30px">M2</text>
    <circle cx="1880" cy="645" r="48" class="o"/><text x="1880" y="656" class="t" style="font-size:30px">M3</text>
    <circle cx="1880" cy="815" r="48" class="o"/><text x="1880" y="826" class="t" style="font-size:30px">M4</text>
    <path class="l" d="M1720,305H1832M1720,475H1832M1720,645H1832M1720,815H1832"/>
    <text x="1776" y="293" class="s" style="font-size:18px">3상</text>
    <text x="1776" y="463" class="s" style="font-size:18px">3상</text>
    <text x="1776" y="633" class="s" style="font-size:18px">3상</text>
    <text x="1776" y="803" class="s" style="font-size:18px">3상</text>
  </g>

  <!-- 모터 전류 -->
  <rect x="60" y="1100" width="180" height="90" rx="8" class="o"/>
  <text x="150" y="1140" class="t">3S LiPo</text>
  <text x="150" y="1170" class="s">11.1V, 만충 12.6V</text>
  <rect x="240" y="1132" width="14" height="26"/>
  <text x="335" y="1125" class="s">XT60 (뽑아서 OFF)</text>
  <path class="p" d="M254,1145H420V1340H1595V1190"/>
  <text x="1010" y="1328" class="v r" text-anchor="middle" font-weight="bold">모터 전류 14AWG 약 15cm 이내, PCB를 지나지 않음</text>
  <rect x="1490" y="1100" width="210" height="90" rx="10" class="o"/>
  <text x="1595" y="1138" class="t" style="font-size:22px">전원 분배 보드</text>
  <text x="1595" y="1168" class="s">40A 이상, 4출력</text>
  <path class="p" d="M1525,1100V335"/>
  <path class="p" d="M1525,335H1540M1525,505H1540M1525,675H1540M1525,845H1540" style="stroke-width:7"/>
  <text x="1540" y="960" class="n" style="fill:#b3261e">ESC 전원 18~20AWG</text>
  <text x="1612" y="1240" class="n">ESC 쪽 전해가 없거나 16V면</text>
  <text x="1612" y="1268" class="n">분배 보드에 35V 470µF 추가</text>

  <!-- 로직 전원 -->
  <circle cx="420" cy="1145" r="9" fill="#b3261e"/>
  <path class="l" d="M420,1145H560" marker-end="url(#a)"/>
  <text x="480" y="1178" class="s">로직 탭</text>
  <rect x="560" y="1105" width="70" height="80" rx="6" class="b"/>
  <text x="595" y="1140" class="t" style="font-size:20px">J1</text>
  <text x="595" y="1166" class="s" style="font-size:17px">2P</text>
  <rect x="670" y="1105" width="120" height="80" rx="6" class="b"/>
  <text x="730" y="1140" class="t" style="font-size:20px">폴리퓨즈</text>
  <text x="730" y="1166" class="s" style="font-size:17px">0.5A 24V</text>
  <path class="l" d="M630,1145H670M790,1145H900"/>
  <circle cx="830" cy="1145" r="6"/>
  <path class="l" d="M830,1145V1210"/>
  <rect x="760" y="1210" width="140" height="58" rx="6" class="b"/>
  <text x="830" y="1236" class="s" style="font-size:18px;fill:#000">입력 C</text>
  <text x="830" y="1258" class="s" style="font-size:18px;fill:#000">35V 100µF</text>
  <rect x="920" y="1100" width="150" height="90" rx="8" class="b"/>
  <text x="995" y="1140" class="t">MP1584</text>
  <text x="995" y="1170" class="s">5V 강압 모듈</text>
  <path class="l" d="M900,1145H920M1070,1145H1140"/>
  <circle cx="1105" cy="1145" r="6"/>
  <path class="l" d="M1105,1145V1210"/>
  <rect x="1035" y="1210" width="140" height="58" rx="6" class="b"/>
  <text x="1105" y="1236" class="s" style="font-size:18px;fill:#000">5V 벌크 C</text>
  <text x="1105" y="1258" class="s" style="font-size:18px;fill:#000">35V 100µF</text>
  <!-- SW1 -->
  <circle cx="1146" cy="1145" r="6" class="l"/>
  <circle cx="1202" cy="1145" r="6" class="l"/>
  <path class="l" d="M1152,1141L1196,1115"/>
  <text x="1174" y="1090" class="t" style="font-size:20px">SW1</text>
  <text x="1262" y="1190" class="s" text-anchor="start" style="font-size:17px">0.3A, 5V 경로만</text>
  <path class="l" d="M1208,1145H1250V870H1040V800" marker-end="url(#a)"/>
  <text x="1262" y="1000" class="v" font-weight="bold">+5V</text>
  <text x="1262" y="1030" class="n">모듈 · GY-521</text>
  <text x="1262" y="1058" class="n">HC-SR04 · HC-06</text>
  <text x="1262" y="1086" class="n">각각 100nF</text>
  <text x="1145" y="858" class="s" style="font-size:18px">VCC</text>

  <!-- 전압 감지 -->
  <path class="l" d="M830,1145V1040"/>
  <rect x="740" y="960" width="180" height="80" rx="6" class="b"/>
  <text x="830" y="994" class="t" style="font-size:21px">VBAT 분압</text>
  <text x="830" y="1022" class="s" style="font-size:18px">10k+10k / 10k → 4.2V</text>
  <path class="l" d="M830,960V925"/>
  <rect x="680" y="850" width="240" height="75" rx="6" class="b"/>
  <text x="800" y="881" class="s" style="font-size:18px;fill:#000">직렬 1kΩ · 100nF</text>
  <text x="800" y="908" class="s" style="font-size:18px;fill:#000">BAT54 → VCC 클램프</text>
  <path class="l" d="M920,885H950V800" marker-end="url(#a)"/>
  <text x="960" y="842" class="n" style="font-size:19px">PF0</text>

  <!-- 동작 흐름 -->
  <line x1="32" y1="1385" x2="1968" y2="1385" stroke="#000" stroke-width="2"/>
  <text x="32" y="1432" font-size="30" font-weight="bold">동작 흐름</text>
  <g font-size="22">
    <text x="40" y="1474">① 조종: Tera Term 키 입력 → Bluetooth(HC-06), 안 되면 AR-UART2USB 유선 → USART1 수신 — 스로틀 증감, 긴급 정지, 생존 신호</text>
    <text x="40" y="1510">② 자세 제어 (빠른 루프, 수백 Hz): IMU를 I²C로 읽기 → 상보 필터로 각도 계산 → Roll / Pitch / Yaw PID</text>
    <text x="40" y="1546">③ 고도 측정 (느린 루프): HC-SR04에 Trig 펄스 → Echo 폭을 외부 인터럽트로 측정 → 필터 후 고도 계산</text>
    <text x="40" y="1582">④ 출력: 스로틀 + PID 보정값 → PWM ×4 → ESC → BLDC 모터 회전수 조절</text>
    <text x="40" y="1618">⑤ 감시: 배터리 전압(ADC PF0) · 고도를 주기적으로 송신, 생존 신호가 끊기면 모터 정지 (페일세이프)</text>
  </g>
</svg>
