<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1150" width="1700" height="1150" font-family="Malgun Gothic, 'Noto Sans KR', sans-serif">
  <defs>
    <pattern id="pins" width="2" height="2.54" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1.27" r="0.6" fill="#b8860b"/>
    </pattern>
    <style>
      .pcb{fill:#dcebd8;stroke:#2f6b34;stroke-width:.25}
      .mod{fill:#f3c9c4;stroke:#a33;stroke-width:.25}
      .part{fill:#fff;stroke:#222;stroke-width:.22}
      .key{fill:#ffe9a8;stroke:#222;stroke-width:.22}
      .off{fill:#e4e9f5;stroke:#335;stroke-width:.22}
      .hole{fill:#fff;stroke:#555;stroke-width:.2}
      .dash{fill:none;stroke:#a33;stroke-width:.2;stroke-dasharray:1 .7}
      .h{font-size:22px;font-weight:bold}
      .s{font-size:14px}
      .n{font-size:14px;fill:#333}
      .b{font-weight:bold}
      .w{fill:#b00}
      .ld{stroke:#777;stroke-width:1;fill:none}
    </style>
  </defs>
  <rect width="1700" height="1150" fill="#fff"/>

  <text x="30" y="42" font-size="30" font-weight="bold">BLDC PCB 배치 스케치 (제작 전 초안)</text>
  <text x="30" y="68" class="n">치수 단위 mm · 부품 위치는 대략 · 모터·ESC·배터리 모델은 미확정이라 후보 기준 · 모듈 핀 줄 간격 22.86은 추정(실측 필요)</text>

  <!-- ========== FRONT ========== -->
  <text x="200" y="95" class="h">앞면 (40 × 84)</text>
  <g transform="translate(200,105) scale(8)">
    <rect class="pcb" width="40" height="84" rx="1"/>
    <g class="hole"><circle cx="2.5" cy="2.5" r="1.1"/><circle cx="37.5" cy="2.5" r="1.1"/><circle cx="2.5" cy="81.5" r="1.1"/><circle cx="37.5" cy="81.5" r="1.1"/></g>
    <rect class="mod" x="7.3" y="3.9" width="25.4" height="76.2" rx=".6"/>
    <rect x="7.57" y="5.18" width="2" height="73.66" fill="url(#pins)"/>
    <rect x="30.43" y="5.18" width="2" height="73.66" fill="url(#pins)"/>
    <rect class="part" x="14" y="4.4" width="12" height="3.2"/>
    <text x="20" y="6.6" font-size="1.5" text-anchor="middle">USART 커넥터</text>
    <text x="20" y="38" font-size="2.4" font-weight="bold" text-anchor="middle">AT128A-70B</text>
    <text x="20" y="41" font-size="1.7" text-anchor="middle">25.4 × 76.2 (대여)</text>
    <text x="20" y="43.6" font-size="1.7" text-anchor="middle">암헤더 1×15 ×4 탈착</text>
    <text x="20" y="46.2" font-size="1.7" text-anchor="middle">모듈 아래 앞면 부품 없음</text>
    <!-- left strip -->
    <rect class="part" x="1.5" y="12" width="3.2" height="10.16"/>
    <rect class="part" x="1.6" y="25.5" width="3" height="6"/>
    <rect class="key" x="1.5" y="36" width="3.2" height="12.7"/>
    <rect class="part" x="1.5" y="52" width="3.3" height="15.2"/>
    <rect class="key" x="1.5" y="68.6" width="3.2" height="10.16"/>
    <!-- right strip -->
    <rect class="part" x="34.8" y="6" width="3.3" height="6.6"/>
    <rect class="key" x="33.6" y="20" width="5.6" height="12"/>
    <rect class="key" x="35" y="71" width="3.2" height="5.08"/>
  </g>
  <!-- front labels -->
  <g class="s" text-anchor="end">
    <text x="182" y="240" class="s">J2 HC-SR04 4P</text>
    <text x="182" y="340">C 10µF + 100nF</text>
    <text x="182" y="446">J3 ESC 신호 5P</text>
    <text x="182" y="464" class="n">M1–M4 + GND</text>
    <text x="182" y="590">R 100Ω ×4 직렬</text>
    <text x="182" y="608" class="n">+ 10k ×4 풀다운</text>
    <text x="182" y="690" class="b">J4 HC-06 4P</text>
    <text x="182" y="708" class="n">UART 전환 때 뽑음</text>
  </g>
  <path class="ld" d="M186,235H212M186,335H213M186,442H212M186,586H212M186,686H212"/>
  <g class="s">
    <text x="538" y="181">R·R·C 10k/10k → PF0</text>
    <text x="538" y="316" class="b">SW1 5V 전원 스위치</text>
    <text x="538" y="334" class="n">모터 전류 안 지남</text>
    <text x="538" y="702" class="b">J1 VBAT 2P</text>
    <text x="538" y="720" class="n">ESC 패드에서 분기</text>
  </g>
  <path class="ld" d="M534,176H506M534,312H511M534,698H506"/>

  <!-- ========== BACK ========== -->
  <text x="850" y="95" class="h">뒷면 (좌우 반전해서 봄)</text>
  <g transform="translate(850,105) scale(8)">
    <rect class="pcb" width="40" height="84" rx="1"/>
    <g class="hole"><circle cx="2.5" cy="2.5" r="1.1"/><circle cx="37.5" cy="2.5" r="1.1"/><circle cx="2.5" cy="81.5" r="1.1"/><circle cx="37.5" cy="81.5" r="1.1"/></g>
    <rect class="dash" x="7.3" y="3.9" width="25.4" height="76.2"/>
    <rect x="7.57" y="5.18" width="2" height="73.66" fill="url(#pins)"/>
    <rect x="30.43" y="5.18" width="2" height="73.66" fill="url(#pins)"/>
    <text x="20" y="17" font-size="1.8" text-anchor="middle" fill="#2f6b34">GND 플레인</text>
    <!-- IMU -->
    <rect class="key" x="12" y="31.5" width="16" height="21"/>
    <rect x="25.3" y="32.5" width="2" height="20.32" fill="url(#pins)"/>
    <text x="18.3" y="38" font-size="2" font-weight="bold" text-anchor="middle">GY-521</text>
    <text x="18.3" y="40.6" font-size="1.5" text-anchor="middle">16 × 21</text>
    <path d="M16,42H21M18.5,39.5V44.5" stroke="#b00" stroke-width=".25" transform="translate(1.5,0)"/>
    <text x="18.3" y="47.5" font-size="1.5" text-anchor="middle">기체 중심</text>
    <!-- buck -->
    <rect class="key" x="11.5" y="56" width="17" height="22"/>
    <rect class="part" x="13" y="56.6" width="14" height="2"/>
    <rect class="part" x="13" y="75.4" width="14" height="2"/>
    <text x="20" y="58.2" font-size="1.5" text-anchor="middle">OUT 5V</text>
    <text x="20" y="77" font-size="1.5" text-anchor="middle">IN 2S</text>
    <text x="20" y="66" font-size="2" font-weight="bold" text-anchor="middle">MP1584</text>
    <text x="20" y="68.6" font-size="1.5" text-anchor="middle">17 × 22 × 4</text>
    <circle class="part" cx="24.5" cy="71.5" r="1.2"/>
    <rect class="key" x="34.2" y="60" width="3.3" height="4.6"/>
  </g>
  <g class="s" text-anchor="end">
    <text x="832" y="440" class="b">IMU 소켓 8P</text>
    <text x="832" y="458" class="n">PD0·PD1·PE6 연결</text>
    <text x="832" y="476" class="n">축 부호 펌웨어 반전</text>
    <text x="832" y="640" class="b">강압 모듈</text>
    <text x="832" y="658" class="n">5.0V 조정 후 납땜</text>
    <text x="832" y="676" class="n">(트리머 위치 실물 확인)</text>
  </g>
  <path class="ld" d="M836,436H946M836,636H942"/>
  <text x="1182" y="590" class="s b">R 분압</text>
  <text x="1182" y="608" class="n">TXD1 5V →</text>
  <text x="1182" y="626" class="n">HC-06 RX 3.3V</text>
  <path class="ld" d="M1178,604H1150"/>

  <!-- ========== FRAME ========== -->
  <text x="1310" y="95" class="h">프레임 크기감 (위에서)</text>
  <g transform="translate(1495,310) scale(1.85)">
    <g fill="none" stroke="#88a" stroke-width=".6" stroke-dasharray="2 1.5">
      <circle cx="-60" cy="-60" r="38"/><circle cx="60" cy="-60" r="38"/><circle cx="-60" cy="60" r="38"/><circle cx="60" cy="60" r="38"/>
    </g>
    <path d="M-60,-60L60,60M60,-60L-60,60" stroke="#333" stroke-width="3"/>
    <g fill="#333"><circle cx="-60" cy="-60" r="7"/><circle cx="60" cy="-60" r="7"/><circle cx="-60" cy="60" r="7"/><circle cx="60" cy="60" r="7"/></g>
    <rect class="pcb" x="-20" y="-42" width="40" height="84" stroke-width=".8"/>
    <text x="0" y="3" font-size="8" text-anchor="middle">PCB</text>
    <path d="M60,-60L20,-42" stroke="#b00" stroke-width=".8"/>
  </g>
  <text x="1310" y="525" class="s">3인치 프로펠러(지름 76) 가정 · X자 배치</text>
  <text x="1310" y="545" class="s b">모터 대각 간격 약 170 필요</text>
  <text x="1310" y="565" class="n">프로펠러 끝 ↔ PCB 모서리 여유 약 6</text>
  <text x="1310" y="585" class="n">프로펠러 면이 모듈 위로 올라가면 더 줄일 수 있음</text>

  <!-- ========== SIDE ========== -->
  <text x="60" y="825" class="h">옆에서 본 적층 (mm, 대략)</text>
  <g transform="translate(70,840) scale(5)">
    <rect class="mod" x="3.9" y="3" width="76.2" height="1.6"/>
    <rect class="part" x="14" y="0" width="12" height="3"/>
    <rect fill="#ddd" stroke="#555" stroke-width=".2" x="3.9" y="4.6" width="76.2" height="8.5"/>
    <rect class="pcb" x="0" y="13.1" width="84" height=".8"/>
    <rect class="part" x="33.5" y="13.9" width="18" height="8.5"/>
    <rect class="key" x="31.5" y="22.4" width="21" height="1.6"/>
    <rect class="key" x="56" y="14.6" width="22" height="4"/>
    <g fill="#999"><rect x="1.5" y="13.9" width="2" height="20.1"/><rect x="80.5" y="13.9" width="2" height="20.1"/></g>
    <rect class="off" x="26.5" y="29" width="31" height="5"/>
    <rect class="off" x="59" y="30.5" width="20" height="3.5"/>
    <rect fill="#555" x="-3" y="34" width="90" height="2"/>
    <rect class="off" x="11" y="36" width="62" height="15"/>
    <rect fill="none" stroke="#335" stroke-width=".25" stroke-dasharray="1.2 .8" x="19.5" y="36" width="45" height="15"/>
  </g>
  <g class="n">
    <text x="510" y="862">모듈 (USART·JTAG 윗면)</text>
    <text x="510" y="900">암헤더 8.5 + PCB 0.8</text>
    <text x="510" y="945">GY-521 · MP1584 (뒷면)</text>
    <text x="510" y="1000">4-in-1 ESC + HC-06 (프레임 위, PCB 밖)</text>
    <text x="510" y="1050">2S 배터리 + HC-SR04 (아래 나란히)</text>
    <text x="510" y="1080">스페이서 약 20 · 전체 높이 약 51</text>
  </g>

  <!-- ========== NOTES ========== -->
  <text x="850" y="825" class="h">핵심 아이디어</text>
  <g class="s">
    <text x="850" y="855">1. 모터 전류는 PCB를 지나가지 않음: 배터리 → XT30 → ESC 직결, PCB는 얇은 선으로 분기만</text>
    <text x="850" y="880">    → 굵은 배선·대전류 커넥터·MOSFET 없음, 보드 60×100 → 40×84 (약 6g 추정)</text>
    <text x="850" y="905">2. 수업 요구인 모듈 전원 스위치를 5V 쪽에만 둠 (배터리 차단은 XT30 탈착)</text>
    <text x="850" y="930">3. IMU를 뒷면 중앙에 두어 기체 회전 중심에 맞춤, 모터·ESC에서 떨어짐</text>
    <text x="850" y="955">4. 통신: HC-06 우선 → 안 되면 J4를 뽑고 모듈 USART 커넥터에 유선 (둘 다 USART1, 동시 연결 금지)</text>
  </g>
  <text x="850" y="990" class="h w">제작 전 확인</text>
  <g class="s">
    <text x="850" y="1016">① 모듈 핀 줄 간격 22.86 실측 — 틀리면 보드 폐기</text>
    <text x="850" y="1038">② ESC가 1–2ms PWM 입력과 5V 신호를 받는지 (제품 설명에 DShot만 적힌 경우 많음)</text>
    <text x="850" y="1060">③ MP1584 패드 간격·트리머 위치 실물 확인 → 풋프린트</text>
    <text x="850" y="1082">④ GY-521 소켓 높이 + 부품이 프레임·ESC와 안 닿는지 (스페이서 길이)</text>
    <text x="850" y="1104">⑤ 프레임 STL 구멍 간격 ↔ PCB M2 구멍 36 × 79</text>
  </g>
  <g class="s" transform="translate(30,1125)">
    <rect x="0" y="-11" width="14" height="14" fill="#ffe9a8" stroke="#222"/><text x="20" y="1">이번에 새로 들어가는 부분</text>
    <rect x="240" y="-11" width="14" height="14" fill="#e4e9f5" stroke="#335"/><text x="260" y="1">PCB 밖</text>
    <rect x="340" y="-11" width="14" height="14" fill="#f3c9c4" stroke="#a33"/><text x="360" y="1">대여 모듈</text>
  </g>
</svg>
